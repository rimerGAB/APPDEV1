<!DOCTYPE html>
<html>
<head>
  <title>Attendance Monitoring</title>
</head>
<body>
  <h1>Attendance Monitoring System</h1>

  <button id="changeColorBtn">Change Dashboard Background</button>

  <p id="message">Attendance status will update in 2 seconds.</p>

  <script>
    const button = document.getElementById("changeColorBtn");

    button.addEventListener("click", () => {
      const color = prompt("What color should the dashboard background be?");
      document.body.style.backgroundColor = color;
    });

    const message = document.getElementById("message");

    setTimeout(() => {
      message.textContent = "Attendance status updated automatically!";
    }, 2000);
  </script>
</body>
</html>
